name: Ejecutar Transformaciones (AE1 y AE2)

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ejecutar-transformaciones-main
  cancel-in-progress: false

jobs:
  ejecutar-notebooks:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Crear entorno virtual
        run: python -m venv .venv

      - name: Instalar dependencias
        run: |
          source .venv/bin/activate
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install pyarrow openpyxl

      - name: Limpiar datos y reportes generados (AE1 y AE2)
        run: |
          mkdir -p src/AE1/sincronicas/datos src/AE1/sincronicas/reportes
          find src/AE1/sincronicas/datos -mindepth 1 -delete
          find src/AE1/sincronicas/reportes -mindepth 1 -delete

          mkdir -p src/AE2/datos src/AE2/resultados
          find src/AE2/datos -mindepth 1 -delete
          find src/AE2/resultados -mindepth 1 -delete

      - name: Ejecutar transformaciones.ipynb (AE1)
        working-directory: src/AE1/sincronicas
        run: |
          source ../../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            transformaciones.ipynb

      - name: Ejecutar transformaciones.ipynb (AE2)
        working-directory: src/AE2/notebooks
        run: |
          source ../../../.venv/bin/activate
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            --ExecutePreprocessor.timeout=1800 \
            transformaciones.ipynb

      - name: Confirmar cambios generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            src/AE1/sincronicas/datos \
            src/AE1/sincronicas/reportes \
            src/AE1/sincronicas/transformaciones.ipynb \
            src/AE2/datos \
            src/AE2/resultados \
            src/AE2/notebooks/transformaciones.ipynb

          if git diff --cached --quiet; then
            echo "No se generaron cambios."
            exit 0
          fi

          git commit -m "chore: actualizar resultados de transformaciones AE1 y AE2"
          git push origin HEAD:main
